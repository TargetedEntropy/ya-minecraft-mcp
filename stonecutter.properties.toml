# Mod and dependency versions for every node. A key under ["<mc>"] applies to both loaders on that
# Minecraft version; [fabric."<mc>"] / [neoforge."<mc>"] apply to one loader.
mod.id = "yamcmcp"
mod.name = "YAMC MCP"
mod.group = "dev.yamc.mcp"
mod.version = "0.2.0"
mod.license = "MIT"
mod.curseforge_project_id = "1831975"

deps.fabric_loader = "0.20.1"
loomx.loom_version = "1.19-SNAPSHOT"

["1.21.1"]
# Minecraft releases this jar is marked compatible with when published.
mod.mc_releases = ["1.21", "1.21.1"]

[fabric."1.21.1"]
mod.mc_compat = ">=1.21 <=1.21.1"
deps.fabric_api = "0.116.18+1.21.1"

[neoforge."1.21.1"]
mod.mc_compat = "[1.21.1]"
deps.neo_loader = "21.1.267"
deps.neo_compat = "[21.1.267,)"
