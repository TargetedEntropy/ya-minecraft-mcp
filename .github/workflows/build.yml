name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # One job per Minecraft version; each builds the Fabric and NeoForge jars.
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.21.1', '1.21.4', '1.21.5', '1.21.8', '1.21.10', '1.21.11', '26.1.2', '26.2', '26.3']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # The last one is the default JVM, which runs Gradle (Stonecutter needs 25); 21 is a toolchain for 1.21.x.
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew ":${{ matrix.minecraft }}-fabric:buildAndCollect" ":${{ matrix.minecraft }}-neoforge:buildAndCollect" ":${{ matrix.minecraft }}-neoforge:test"
      - uses: actions/upload-artifact@v4
        with:
          name: jars-${{ matrix.minecraft }}
          path: build/libs/*/*.jar
          if-no-files-found: error

  release:
    # A v* tag publishes every jar to a draft GitHub release (review it, then publish).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: jars
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft --title "YAMC MCP ${GITHUB_REF_NAME#v}" --generate-notes jars/*/*.jar
